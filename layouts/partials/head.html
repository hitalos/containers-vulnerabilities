<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="{{ or .Summary site.Params.description }}">
	<title>{{ site.Title }}{{ if not .IsHome }}{{ with .Title }} - {{ . }}{{ end }}{{ end }}</title>
	<base href="{{ site.BaseURL }}" />
	{{ with resources.Get "styles/main.css" -}}
	<style type="text/css">
		{{ .Content | safeCSS }}
	</style>
	{{ end }}
</head>
